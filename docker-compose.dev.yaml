# Security: Use .env file for all credentials
# Copy .env.example to .env and update with secure values before running
#
# This is a minimal dev setup with only essential services.
# For Langfuse, pgAdmin, redis-commander, etc., see docker-compose.full.yaml

services:
  redis_orchid_core:
    image: "bitnami/redis:latest"
    container_name: orchid-core-dev-redis
    networks:
      - orchid-core
    environment:
      - REDIS_MASTER_PASSWORD=${REDIS_PASSWORD:-CHANGE_ME_IN_ENV_FILE}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-CHANGE_ME_IN_ENV_FILE}
    ports:
      - "6379:6379"

  database:
    image: pgvector/pgvector:pg17
    container_name: orchid_core_pg_db
    restart: always
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-orchid_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-CHANGE_ME_IN_ENV_FILE}
      POSTGRES_DB: ${POSTGRES_DB:-orchid_core}
    volumes:
      - orchid_core_pg_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    networks:
      - orchid-core

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq/
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-orchid_mq}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-CHANGE_ME_IN_ENV_FILE}
    networks:
      - orchid-core

volumes:
  rabbitmq-data:
  orchid_core_pg_data:

networks:
  orchid-core:
    driver: bridge
