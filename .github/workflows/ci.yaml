name: CI - Build and Test

on:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  checks: write

env:
  DOTNET_VERSION: "10.0.x"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

  test:
    name: Test with Coverage
    runs-on: ubuntu-latest
    needs: build
    defaults:
      run:
        working-directory: services/backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore

      - name: Run Unit Tests with Coverage
        run: |
          dotnet test \
            --no-restore \
            --configuration Release \
            --collect:"XPlat Code Coverage" \
            --settings coverlet.runsettings \
            --results-directory ./TestResults \
            --logger "trx;LogFileName=test-results.trx" \
            -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=cobertura

      - name: Install ReportGenerator
        run: dotnet tool install --global dotnet-reportgenerator-globaltool

      - name: Generate Coverage Report
        run: |
          reportgenerator \
            -reports:"./TestResults/**/coverage.cobertura.xml" \
            -targetdir:"./TestResults/CoverageReport" \
            -reporttypes:"Html;Cobertura;TextSummary;MarkdownSummaryGithub"

      - name: Output Coverage Summary
        run: cat ./TestResults/CoverageReport/Summary.txt

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: services/backend/TestResults/CoverageReport
          retention-days: 30

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: services/backend/TestResults/*.trx
          retention-days: 30

      - name: Add Coverage PR Comment
        uses: marocchino/sticky-pull-request-comment@v2
        if: github.event_name == 'pull_request'
        with:
          recreate: true
          path: services/backend/TestResults/CoverageReport/SummaryGithub.md

  coverage-gate:
    name: Coverage Threshold Check
    runs-on: ubuntu-latest
    needs: test
    defaults:
      run:
        working-directory: services/backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore

      - name: Run Tests with Coverage Thresholds
        run: |
          dotnet test \
            --no-restore \
            --configuration Release \
            --collect:"XPlat Code Coverage" \
            --settings coverlet.runsettings \
            --results-directory ./TestResults \
            -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=cobertura

      - name: Install ReportGenerator
        run: dotnet tool install --global dotnet-reportgenerator-globaltool

      - name: Check Coverage Thresholds
        run: |
          # Generate coverage report
          reportgenerator \
            -reports:"./TestResults/**/coverage.cobertura.xml" \
            -targetdir:"./TestResults/CoverageReport" \
            -reporttypes:"TextSummary"

          # Extract line coverage percentage
          COVERAGE=$(grep "Line coverage" ./TestResults/CoverageReport/Summary.txt | grep -oP '\d+\.?\d*(?=%)' | head -1)

          echo "Current line coverage: ${COVERAGE}%"

          # Threshold check (start with current baseline, increase as coverage improves)
          # Current baseline: 43.5% - We'll set initial threshold at 40% to not break CI
          # TODO: Increase thresholds as coverage improves:
          #   - Phase 1: 40% (current baseline)
          #   - Phase 2: 60% (after Domain + Application tests)
          #   - Phase 3: 75% (after Infrastructure tests)
          #   - Phase 4: 85% (final target)
          THRESHOLD=40

          if (( $(echo "$COVERAGE < $THRESHOLD" | bc -l) )); then
            echo "::error::Coverage ${COVERAGE}% is below threshold ${THRESHOLD}%"
            exit 1
          else
            echo "::notice::Coverage ${COVERAGE}% meets threshold ${THRESHOLD}%"
          fi

      - name: Check Domain Coverage
        continue-on-error: true
        run: |
          # This check is informational until we reach targets
          # Target: 95%
          echo "::notice::Domain coverage target: 95% (enforcement pending)"

      - name: Check Application Coverage
        continue-on-error: true
        run: |
          # This check is informational until we reach targets
          # Target: 90%
          echo "::notice::Application coverage target: 90% (enforcement pending)"

      - name: Check Adapter Coverage
        continue-on-error: true
        run: |
          # This check is informational until we reach targets
          # Target: 80%
          echo "::notice::Adapter coverage target: 80% (enforcement pending)"
